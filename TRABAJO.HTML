<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Académico SENA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Sistema Académico - SENA</h1>

    <!-- Formulario para registrar estudiante -->
    <section class="card">
        <h2>Registrar Estudiante</h2>
        <input type="text" id="nombreEst" placeholder="Nombre del estudiante">
        <input type="number" id="nota1" placeholder="Nota 1">
        <input type="number" id="nota2" placeholder="Nota 2">
        <input type="number" id="nota3" placeholder="Nota 3">
        <button onclick="registrarEstudiante()">Registrar</button>
    </section>

    <!-- Mostrar lista -->
    <section class="card">
        <h2>Listado de Estudiantes</h2>
        <div id="lista"></div>
    </section>

    <script src="TRABAJO.JS"></script>
</body>
</html>
